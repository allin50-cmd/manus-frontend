name: Framework Security Upgrade Trial

on:
  push:
    branches:
      - agent/full-audit-dependency-security

permissions:
  contents: write

jobs:
  next-upgrade-trial:
    if: ${{ !contains(github.event.head_commit.message, '[upgrade-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install current locked dependencies
        run: npm ci

      - name: Upgrade patched framework stack
        run: >-
          npm install --save-exact
          next@16.3.0
          react@latest
          react-dom@latest
          @types/react@latest
          @types/react-dom@latest

      - name: Dependency security gate
        run: npm audit --audit-level=high

      - name: Type-check
        run: npm run type-check

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
        env:
          NODE_ENV: production
          JWT_SECRET: audit-only-ci-secret-32-characters-minimum
          DEFAULT_PASSCODE: audit-only-passcode

      - name: Diff integrity
        run: git diff --check

      - name: Commit generated dependency update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit"
            exit 0
          fi
          git commit -m "fix: upgrade framework security baseline [upgrade-generated]"
          git push origin HEAD:agent/full-audit-dependency-security
