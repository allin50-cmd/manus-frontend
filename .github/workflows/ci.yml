name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: React lint (changed files)
        run: npm run lint
        env:
          LINT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}

      - name: Type-check client
        run: npm run type-check

      - name: Type-check server (strict)
        run: npm run type-check:server

      - name: Unit tests
        run: npm test
        # Integration tests skip cleanly when DATABASE_URL is absent.
        # Run the full suite (including integration) in a separate job
        # that has DATABASE_URL provisioned.

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production
