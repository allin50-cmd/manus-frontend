name: Dependency Security Audit

on:
  push:
    branches:
      - agent/full-audit-dependency-security
  pull_request:
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/dependency-security-audit.yml

permissions:
  contents: read

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Fail on high or critical advisories
        run: npm audit --audit-level=high
